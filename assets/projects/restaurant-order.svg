<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f0a18"/>
      <stop offset="100%" stop-color="#150710"/>
    </linearGradient>
    <pattern id="dots2" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ff2f87" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bg2)"/>
  <rect width="800" height="450" fill="url(#dots2)"/>

  <!-- phone -->
  <g transform="translate(300,70)">
    <rect x="0" y="0" width="200" height="310" rx="26" fill="#150710" stroke="#ff2f87" stroke-width="4"/>
    <rect x="16" y="26" width="168" height="258" rx="6" fill="none" stroke="#f7a8cf" stroke-width="2" opacity="0.4"/>
    <circle cx="100" cy="298" r="7" fill="none" stroke="#ff2f87" stroke-width="3"/>

    <!-- order steps -->
    <circle cx="45" cy="90" r="9" fill="#ff2f87"/>
    <line x1="45" y1="99" x2="45" y2="155" stroke="#ff2f87" stroke-width="3"/>
    <line x1="66" y1="90" x2="150" y2="90" stroke="#f7a8cf" stroke-width="4" stroke-linecap="round"/>

    <circle cx="45" cy="164" r="9" fill="none" stroke="#f7a8cf" stroke-width="3.5"/>
    <line x1="45" y1="173" x2="45" y2="229" stroke="#f7a8cf" stroke-width="3" opacity="0.6"/>
    <line x1="66" y1="164" x2="150" y2="164" stroke="#f7a8cf" stroke-width="4" stroke-linecap="round" opacity="0.75"/>

    <circle cx="45" cy="238" r="9" fill="none" stroke="#f7a8cf" stroke-width="3.5" opacity="0.5"/>
    <line x1="66" y1="238" x2="150" y2="238" stroke="#f7a8cf" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- plate + fork -->
  <g transform="translate(560,240)">
    <circle cx="0" cy="0" r="46" fill="none" stroke="#ff2f87" stroke-width="4"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#f7a8cf" stroke-width="2.5" opacity="0.6"/>
    <line x1="-90" y1="-40" x2="-90" y2="40" stroke="#f7a8cf" stroke-width="4" stroke-linecap="round"/>
    <line x1="-100" y1="-40" x2="-100" y2="-10" stroke="#f7a8cf" stroke-width="4" stroke-linecap="round"/>
    <line x1="-80" y1="-40" x2="-80" y2="-10" stroke="#f7a8cf" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
